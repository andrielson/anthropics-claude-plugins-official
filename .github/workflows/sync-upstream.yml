name: Sync with upstream

on:
  schedule:
    - cron: '23 8,20 * * *'  # Twice daily: 08:23 & 20:23 UTC — adjust to taste
  workflow_dispatch:

permissions:
  contents: write  # push the rebase
  actions: write   # disable upstream-inherited workflows

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0  # full history, required for the rebase

      - name: Rebase main onto upstream and push
        run: |
          set -euo pipefail
          RETENTION_DAYS=30  # how long pre-sync backup tags are kept

          # The rebase needs a committer identity; the author of each replayed
          # commit is preserved.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/anthropics/claude-plugins-official.git
          git fetch upstream main

          # Already up to date? Nothing to sync (the next step still runs).
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Fork is already up to date with upstream."
            exit 0
          fi

          # Backup tag: keeps the pre-rebase state reachable, so recovering files
          # that a sync propagated away (e.g. deleted upstream by mistake) is a
          # single checkout even if we notice days later:
          #   git fetch origin tag <tag> && git checkout <tag> -- path/to/file
          # The short SHA suffix keeps tags unique if two runs land in the same
          # minute. Pushed before the rebase so the backup survives a failed sync.
          tag="sync/backup/$(date -u +%Y-%m-%dT%H%M)-$(git rev-parse --short HEAD)"
          git tag "$tag"
          git push origin "refs/tags/$tag"

          git rebase upstream/main
          git push --force-with-lease origin main

          # Prune backup tags older than RETENTION_DAYS. Tags are listed from the
          # remote because actions/checkout fetches with --no-tags. The timestamp
          # encoded in the tag name drives retention: for this fixed-width format,
          # lexicographic order equals chronological order.
          cutoff=$(date -u -d "$RETENTION_DAYS days ago" +%Y-%m-%dT%H%M)
          for ref in $(git ls-remote --refs --tags origin 'refs/tags/sync/backup/*' | cut -f2); do
            t=${ref#refs/tags/}
            if [[ "${t#sync/backup/}" < "$cutoff" ]]; then
              echo "Pruning expired backup tag $t"
              git push origin ":refs/tags/$t"
            fi
          done

      - name: Disable inherited upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Paths to KEEP, comma-separated: this workflow itself plus any workflows
          # of our own created in the fork in the future. Every active workflow
          # outside this list (i.e. inherited from upstream) gets disabled —
          # including future ones. KEEP is exported and read via env.KEEP inside
          # the jq expression because gh api's embedded jq does not support
          # --arg bindings.
          export KEEP='.github/workflows/sync-upstream.yml'
          ids=$(gh api "repos/${{ github.repository }}/actions/workflows" --paginate \
            --jq '.workflows[]
                  | . as $wf
                  | select((env.KEEP | split(",") | map(rtrimstr(" ")) | index($wf.path)) | not)
                  | select(.state == "active")
                  | .id')
          if [ -z "$ids" ]; then
            echo "No inherited workflows to disable."
            exit 0
          fi
          for id in $ids; do
            echo "Disabling workflow id $id..."
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$id/disable"
          done
